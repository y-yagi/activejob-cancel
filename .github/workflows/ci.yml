name: CI

on: [push]

jobs:
  build:
    name: Ruby ${{ matrix.ruby }}, Rails ${{ matrix.gemfile }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        ruby: [ "4.0", "3.4", "3.3", "3.2" ]
        gemfile: [ "active_job_81.gemfile", "active_job_80.gemfile", "active_job_72.gemfile" ]

    services:
      redis:
        image: redis:8.12.0@sha256:3c4881844c6421f29fb9f9e8ca4f573d9fbdfb35967d65834504b6994cf6cd3b
        ports:
          - 6379:6379
        # Wait for starting Redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile}}

    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ruby/setup-ruby@v1.344.0
      with:
        ruby-version: ${{ matrix.ruby }}
    - name: Install dependencies
      run: |
        bundle install
    - name: Run test
      run: bundle exec rake
